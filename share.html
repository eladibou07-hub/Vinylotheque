<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d5a526">
  <meta name="robots" content="noindex,nofollow">
  <title>Vinylothèque — lecture seule</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=13.0">
  <style>
    .readonly-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff3c7;border:1px solid #e7c85c;font-size:.72rem;font-weight:900}
    .share-public-hero{display:grid;gap:5px}.share-public-hero h2{margin:0}.share-public-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.8rem}
    .share-public-stats{grid-template-columns:repeat(3,1fr)!important}.share-public-toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:18px}
    .share-public-toolbar input,.share-public-toolbar select{font:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px}
    .public-record{cursor:pointer}.public-record:focus{outline:3px solid rgba(213,165,38,.35);outline-offset:2px}
    .share-rating{color:#9a7a23;font-weight:900;letter-spacing:.03em;margin-top:8px}.share-status{display:inline-block;margin-top:7px;padding:4px 7px;border:1px solid #ead27d;background:#fff7dc;border-radius:999px;font-size:.68rem;font-weight:800}
    .share-detail-cover{width:min(100%,360px);margin:0 auto 14px}.share-detail-cover img,.share-detail-cover .placeholder{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
    .share-detail-artist{font-size:1.05rem;font-weight:800;margin-top:-4px}.share-detail-meta{color:var(--muted);margin:6px 0 14px}.share-detail-info{display:grid;gap:9px}.share-detail-info div{display:grid;grid-template-columns:90px 1fr;gap:10px;padding-top:9px;border-top:1px solid var(--line)}
    .share-loading{max-width:560px;margin:80px auto;text-align:center;padding:24px;color:var(--muted)}
    .share-public-footer{display:flex;justify-content:center;padding:24px}.share-public-footer a{color:inherit}
    @media(max-width:620px){.share-public-toolbar{grid-template-columns:1fr}.share-public-stats{grid-template-columns:repeat(3,1fr)!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">VINYLOTHÈQUE</p><h1>Collection partagée</h1></div>
    <span class="readonly-badge">👁 Lecture seule</span>
  </header>
  <div id="shareLoading" class="share-loading">Chargement de la collection…</div>
  <main id="shareContent" class="shell" hidden>
    <section class="hero"><div class="share-public-hero"><p id="shareOwner" class="eyebrow">COLLECTION PARTAGÉE</p><h2 id="shareCollectionName">Collection de vinyles</h2><div class="share-public-meta"><span id="shareUpdated"></span><span>Consultation uniquement</span></div></div></section>
    <section class="stats share-public-stats" aria-label="Statistiques">
      <article><strong id="shareStatTotal">0</strong><span>vinyles</span></article>
      <article><strong id="shareStatArtists">0</strong><span>artistes</span></article>
      <article><strong id="shareStatPeriod">—</strong><span>période</span></article>
    </section>
    <section class="share-public-toolbar">
      <input id="shareSearch" type="search" placeholder="Rechercher artiste, album, genre…">
      <select id="shareSort" aria-label="Trier"><option value="artist">Artiste A → Z</option><option value="title">Album A → Z</option><option value="year-desc">Année ↓</option><option value="rating-desc">Note ↓</option></select>
    </section>
    <section id="shareEmpty" class="empty" hidden><h3>Aucun résultat</h3><p>Essaie une autre recherche.</p></section>
    <section id="shareGrid" class="grid" aria-live="polite"></section>
  </main>
  <dialog id="shareDetail" class="modal small">
    <div class="modal-head"><div><p class="eyebrow">VINYLE</p><h2 id="shareDetailTitle"></h2></div><button id="shareDetailClose" class="icon-btn" aria-label="Fermer">✕</button></div>
    <div id="shareDetailCover" class="share-detail-cover"></div><div id="shareDetailArtist" class="share-detail-artist"></div><div id="shareDetailMeta" class="share-detail-meta"></div><div id="shareDetailInfo" class="share-detail-info"></div>
  </dialog>
  <footer class="share-public-footer"><a href="./">Créer ma Vinylothèque</a></footer>
  <script src="share.js?v=13.0"></script>
</body>
</html>
